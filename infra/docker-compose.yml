services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pudzian
      POSTGRES_DB: pill_dispenser_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ../backend
    container_name: python_backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:pudzian@db:5432/pill_dispenser_db
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/backend
    restart: always

volumes:
  postgres_data: